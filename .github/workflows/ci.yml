name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test (workflow-engine, spring-boot-starter)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test core modules
        run: |
          mvn -B clean verify \
            -pl workflow-engine,spring-boot-starter \
            -am \
            -DskipTests=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            workflow-engine/target/surefire-reports/
            spring-boot-starter/target/surefire-reports/
          retention-days: 7

  samples-compilation-check:
    # This runner must be restricted to trusted branch pushes/manual runs, never fork PR code.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, eastcom-sdk]
    name: Direct and Order release gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify vendor dependency is provisioned
        run: mvn -B -o dependency:get "-Dartifact=com.eastcom.apollo:order-shaded-client:1.1.18" "-Dtransitive=false"

      - name: Verify direct and Order scenarios
        run: mvn -B clean verify

      - name: Upload sample release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-release-test-reports
          path: '**/target/surefire-reports/'
