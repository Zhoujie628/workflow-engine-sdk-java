name: CI

env:
  A2AT_SDK_REPOSITORY: Zhoujie628/a2a-t-sdk-java
  A2AT_SDK_REF: 0ef79d37f49a9b7a2dbe16b6d9fd1ccdb6d9538d
  A2AT_SDK_VERSION: 1.0.0-0ef79d3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test (workflow-engine, spring-boot-starter)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout pinned unreleased A2A-T SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ env.A2AT_SDK_REPOSITORY }}
          ref: ${{ env.A2AT_SDK_REF }}
          path: .dependencies/a2a-t-sdk-java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install pinned A2A-T SDK components
        working-directory: .dependencies/a2a-t-sdk-java
        run: >-
          mvn -B
          -Drevision=${A2AT_SDK_VERSION}
          -DskipTests
          -pl a2a-t-client,a2a-t-server
          -am install

      - name: Build and test core modules
        run: |
          mvn -B clean verify \
            -pl workflow-engine,spring-boot-starter \
            -am \
            -DskipTests=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            workflow-engine/target/surefire-reports/
            spring-boot-starter/target/surefire-reports/
          retention-days: 7

  samples-compilation-check:
    runs-on: ubuntu-latest
    name: Samples Compilation Check (optional)
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout pinned unreleased A2A-T SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ env.A2AT_SDK_REPOSITORY }}
          ref: ${{ env.A2AT_SDK_REF }}
          path: .dependencies/a2a-t-sdk-java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install pinned A2A-T SDK components
        working-directory: .dependencies/a2a-t-sdk-java
        run: >-
          mvn -B
          -Drevision=${A2AT_SDK_VERSION}
          -DskipTests
          -pl a2a-t-client,a2a-t-server
          -am install

      - name: Build and test samples
        run: mvn -B -pl samples -am verify
