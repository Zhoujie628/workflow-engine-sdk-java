server:
  port: 26337
  ssl:
    # Public demo certificate only. Its private key and password are intentionally known;
    # replace both before any shared, test, staging, or production deployment.
    enabled: true
    key-store: classpath:a2a-server-keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12

spring:
  main:
    banner-mode: off

a2at:
  server:
    agent-card: classpath:agentcard/transport_workbench_agent.json
    path-prefix: /a2a/json

a2a:
  orch-url: https://127.0.0.1:5001
  credentials-path: ${A2A_OMC_CREDENTIALS_PATH:classpath:spn_agent_credentials.json}
  ssl-verify: ${A2A_SSL_VERIFY:false}
  task-cleanup-enabled: ${A2A_TASK_CLEANUP_ENABLED:true}
  task-cleanup-fail-fast: ${A2A_TASK_CLEANUP_FAIL_FAST:true}
  task-cleanup-page-size: ${A2A_TASK_CLEANUP_PAGE_SIZE:100}
  task-cleanup-max-tasks: ${A2A_TASK_CLEANUP_MAX_TASKS:1000}
  # Production default: route A2A messages through the Eastcom Order SDK.
  # Use order plus simulator-enabled=true for the local order demo, or direct to bypass
  # the instruction platform. The simulator is never started outside order mode.
  transport-mode: ${A2A_TRANSPORT_MODE:order}
  mock-gateway-url: ${A2A_MOCK_GATEWAY_URL:http://127.0.0.1:26400}
  order:
    simulator-enabled: ${EASTCOM_ORDER_SIMULATOR_ENABLED:false}
    host: ${EASTCOM_ORDER_HOST:}
    port: ${EASTCOM_ORDER_PORT:0}
    username: ${EASTCOM_ORDER_USERNAME:}
    password: ${EASTCOM_ORDER_PASSWORD:}
    client-id: ${EASTCOM_ORDER_CLIENT_ID:}
    client-secret: ${EASTCOM_ORDER_CLIENT_SECRET:}
    default-ne: ${EASTCOM_ORDER_DEFAULT_NE:}
    city1-ne: ${EASTCOM_ORDER_CITY1_NE:}
    city2-ne: ${EASTCOM_ORDER_CITY2_NE:}
    simulator-city1-target-url: ${EASTCOM_ORDER_SIMULATOR_CITY1_TARGET_URL:https://127.0.0.1:26335}
    simulator-city2-target-url: ${EASTCOM_ORDER_SIMULATOR_CITY2_TARGET_URL:https://127.0.0.1:26336}
    simulator-city1-username: ${EASTCOM_ORDER_SIMULATOR_CITY1_USERNAME:admin}
    simulator-city1-password: ${EASTCOM_ORDER_SIMULATOR_CITY1_PASSWORD:Admin@123}
    simulator-city2-username: ${EASTCOM_ORDER_SIMULATOR_CITY2_USERNAME:admin}
    simulator-city2-password: ${EASTCOM_ORDER_SIMULATOR_CITY2_PASSWORD:Admin@123}
    simulator-connect-timeout-seconds: ${EASTCOM_ORDER_SIMULATOR_CONNECT_TIMEOUT_SECONDS:30}
    simulator-read-timeout-seconds: ${EASTCOM_ORDER_SIMULATOR_READ_TIMEOUT_SECONDS:30}
    login-timeout-seconds: ${EASTCOM_ORDER_LOGIN_TIMEOUT_SECONDS:15}
    timeout-seconds: ${EASTCOM_ORDER_TIMEOUT_SECONDS:600}
    # OMC bearer token is obtained through the Eastcom HttpClient path. The platform
    # substitutes ${ne:username}/${ne:password} from its managed NE credentials.
    omc-auth-enabled: ${EASTCOM_ORDER_OMC_AUTH_ENABLED:true}
    omc-credentials-path: ${EASTCOM_ORDER_OMC_CREDENTIALS_PATH:classpath:spn_agent_credentials.json}
    omc-login-path: ${EASTCOM_ORDER_OMC_LOGIN_PATH:/rest/plat/smapp/v1/oauth/token}
    omc-login-method: ${EASTCOM_ORDER_OMC_LOGIN_METHOD:PUT}
    omc-token-response-header: ${EASTCOM_ORDER_OMC_TOKEN_RESPONSE_HEADER:accessSession}
    omc-request-auth-header: ${EASTCOM_ORDER_OMC_REQUEST_AUTH_HEADER:Authorization}
    omc-request-auth-scheme: ${EASTCOM_ORDER_OMC_REQUEST_AUTH_SCHEME:Bearer}
    omc-token-ttl-seconds: ${EASTCOM_ORDER_OMC_TOKEN_TTL_SECONDS:3600}
    omc-username-field: ${EASTCOM_ORDER_OMC_USERNAME_FIELD:userName}
    omc-password-field: ${EASTCOM_ORDER_OMC_PASSWORD_FIELD:value}
